<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omnicode">
  <title>Omnicode</title>
  <!--
    Mark derived from the upstream icon (rounded body with two eyes), with an
    accent gradient and a small provider-plug notch on the right edge standing
    for the built-in providers.

    Copyright (c) 2026 Hilbras, MIT License.
  -->
  <defs>
    <linearGradient id="lcBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#39D0C8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="#0E0E12"/>

  <!-- body: same silhouette as upstream, scaled up from the 24px mark -->
  <rect
    x="26" y="30"
    width="76" height="52"
    rx="9.5"
    fill="none"
    stroke="url(#lcBody)"
    stroke-width="6.5"
  />

  <!-- eyes -->
  <rect x="46.5" y="45.5" width="6" height="14" rx="1.9" fill="url(#lcBody)"/>
  <rect x="75.5" y="45.5" width="6" height="14" rx="1.9" fill="url(#lcBody)"/>

  <!-- provider notch: three stacked pips on the right edge -->
  <g fill="#FFB86B">
    <rect x="103" y="44" width="6.5" height="6.5" rx="2"/>
    <rect x="103" y="55" width="6.5" height="6.5" rx="2"/>
    <rect x="103" y="66" width="6.5" height="6.5" rx="2"/>
  </g>

</svg>
