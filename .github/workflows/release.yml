name: Release

# Two-phase release, gated on the same checks a human runs before shipping:
#   1. `verify` reuses `release-gate.yml` (guards, typecheck, build, test).
#   2. `release` runs changesets: it opens/updates the "Version Packages" PR, and
#      once that PR merges it publishes `@omnicode/cli` and creates the GitHub
#      Release. A publish therefore cannot happen while the gate is red.
#
# Secrets (never in the repository):
#   NPM_TOKEN      environment secret on the `release` environment — an npm
#                  automation token scoped to `@omnicode`. `actions/setup-node`
#                  writes it into the runner's `.npmrc` as `NODE_AUTH_TOKEN`.
#   GITHUB_TOKEN   provided by Actions; `contents: write` is what lets changesets
#                  push the version branch, tag, and create the Release.
#   id-token       allows npm provenance (OIDC) without any long-lived token for
#                  provenance itself. If the registry account is configured for
#                  npm trusted publishing, `NPM_TOKEN` can be removed entirely.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Warn when no registry credential is available
        # The version PR needs no credential; publishing does. Failing here would
        # block the version PR, so this warns and lets the publish step fail loudly
        # with the registry's real error if the token is genuinely absent.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set on the release environment — publishing will fail; the version PR can still be created."
          fi
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm release:version
          publish: pnpm release
          commit: "ci: release packages"
          title: "ci: release packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify the published version
        if: steps.changesets.outputs.published == 'true'
        run: |
          expected=$(node -p "require('./apps/omnicode-cli/package.json').version")
          published=$(npm view @omnicode/cli dist-tags.latest)
          if [ "$published" != "$expected" ]; then
            echo "::error::npm reports @omnicode/cli@$published but the workspace is at $expected"
            exit 1
          fi
          echo "verified @omnicode/cli@$published"
