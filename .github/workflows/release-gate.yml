name: Release gate

on:
  workflow_dispatch:
  # Called by `release.yml` so a publish can only happen after this gate passes.
  workflow_call:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check:guards includes generated-artifact freshness, which re-runs the
      # engine manifest generators (they import the compiled raw-text loader)
      # and expects the CLI's generated vis asset. Both are build outputs; on a
      # fresh runner they do not exist until build has run. Build first.
      - run: pnpm -r --if-present build
      - run: pnpm check:guards
      - run: pnpm check:audit
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
